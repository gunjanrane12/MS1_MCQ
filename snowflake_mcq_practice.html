<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snowflake MCQ Practice</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#1b2733;--mut:#64748b;--bd:#dbe3ec;--pri:#29b5e8;--ok:#16a34a;--okb:#dcfce7;--no:#dc2626;--nob:#fee2e2}
@media(prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#18222e;--tx:#e6edf5;--mut:#94a3b8;--bd:#2b3a4a;--okb:#12341f;--nob:#3b1717}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
.wrap{max-width:780px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button.pri{background:var(--pri);border-color:var(--pri);color:#04202b;font-weight:600}
button:disabled{opacity:.45;cursor:default}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--pri);width:0}
.meta{color:var(--mut);font-size:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.q{font-size:18px;font-weight:600;margin:10px 0 14px}
.opt{display:flex;gap:10px;width:100%;text-align:left;margin-bottom:8px;padding:12px;border-radius:10px}
.opt b{min-width:22px}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.no{background:var(--nob);border-color:var(--no)}
.exp{margin-top:10px;padding:12px;border-left:4px solid var(--pri);background:var(--bg);border-radius:6px;display:none}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;background:var(--bd)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.grid button{padding:6px 0;font-size:13px}.grid .c{background:var(--okb);border-color:var(--ok)}.grid .w{background:var(--nob);border-color:var(--no)}.grid .cur{outline:2px solid var(--pri)}
.score{font-size:40px;font-weight:700;text-align:center}
.hide{display:none}
</style></head><body><div class="wrap">
<h1>❄️ Snowflake MCQ Practice</h1>
<div id="setup" class="card">
 <div class="row">
  <label>Difficulty <select id="diff"><option value="">All</option><option>Easy</option><option>Medium</option><option>Hard</option></select></label>
  <label>Order <select id="ord"><option value="seq">In order</option><option value="rnd">Shuffled</option></select></label>
  <label>Count <select id="cnt"><option value="0">All</option><option>10</option><option>25</option><option>50</option><option>100</option></select></label>
  <button class="pri" onclick="start()">Start</button>
 </div>
 <p class="meta" id="info"></p>
</div>
<div id="quiz" class="hide">
 <div class="card">
  <div class="meta"><span id="pos"></span><span id="sc"></span></div>
  <div class="bar"><i id="pb"></i></div>
  <div class="meta"><span id="qn"></span><span class="tag" id="df"></span></div>
  <div class="q" id="qt"></div>
  <div id="opts"></div>
  <div class="exp" id="exp"></div>
  <div class="row" style="margin-top:14px">
   <button onclick="go(-1)" id="prev">← Prev</button>
   <button class="pri" onclick="go(1)" id="next">Next →</button>
   <button onclick="finish()" style="margin-left:auto">Finish</button>
  </div>
 </div>
 <div class="card"><div class="meta" style="margin-bottom:8px">Jump to question</div><div class="grid" id="grid"></div></div>
</div>
<div id="res" class="card hide">
 <div class="score" id="final"></div><p class="meta" id="fsub" style="justify-content:center"></p>
 <div class="row" style="justify-content:center"><button class="pri" onclick="start()">Restart</button><button onclick="retryWrong()">Retry wrong ones</button><button onclick="back()">Change settings</button></div>
</div>
</div>
<script>
const ALL=[{"n": 1, "d": "Medium", "q": "The data team at a manufacturing company must test data quality before performing the actual load. Which Snowflake feature or command should they select?", "o": ["FORCE = TRUE", "VALIDATION_MODE = 'RETURN_ERRORS'", "ON_ERROR = 'CONTINUE'", "PURGE = TRUE"], "a": 1, "e": "VALIDATION_MODE can inspect load errors without loading the data."}, {"n": 2, "d": "Easy", "q": "A trainee needs to identify the Snowflake feature that can share live Snowflake data with another Snowflake account without copying it. Which choice is correct?", "o": ["External Data Export", "Secure Data Sharing", "Zero-Copy Cloning", "Account Replication"], "a": 1, "e": "Secure Data Sharing exposes live data without copying or exporting it."}, {"n": 3, "d": "Easy", "q": "For the requirement \"perform the highest-level account administration tasks,\" which Snowflake term is the best fit?", "o": ["SYSADMIN", "SECURITYADMIN", "PUBLIC", "ACCOUNTADMIN"], "a": 3, "e": "ACCOUNTADMIN is Snowflake's highest-level system role and should be used carefully."}, {"n": 4, "d": "Hard", "q": "During a design review for a banking solution, the team must ensure it can let a partner query provider-controlled data without receiving a physical copy. Which Snowflake option is the strongest architectural fit?", "o": ["External Data Export", "Secure Data Sharing", "Zero-Copy Cloning", "Account Replication"], "a": 1, "e": "Secure Data Sharing exposes live data without copying or exporting it."}, {"n": 5, "d": "Easy", "q": "For the requirement \"improve micro-partition organization for columns used frequently in selective filters or joins,\" which Snowflake term is the best fit?", "o": ["Resource Monitor", "Stream", "Clustering Key", "Secure View"], "a": 2, "e": "Clustering keys can improve pruning for large tables with suitable access patterns."}, {"n": 6, "d": "Easy", "q": "Which option best matches this Snowflake responsibility: create and manage warehouses and databases under the standard system hierarchy?", "o": ["PUBLIC", "SYSADMIN", "USERADMIN", "ACCOUNTADMIN"], "a": 1, "e": "SYSADMIN is generally used for warehouses, databases, and related objects."}, {"n": 7, "d": "Medium", "q": "An architect for a e-commerce system has one key requirement: validate or analyze text length. Which option best satisfies it?", "o": ["COUNT()", "LENGTH()", "SIZE()", "DATE_PART()"], "a": 1, "e": "LENGTH returns a string length."}, {"n": 8, "d": "Medium", "q": "In a logistics workload, engineers want to manage privileges centrally by job function instead of user-by-user grants. What should they use?", "o": ["Network Policy", "Result Cache", "Clustering Key", "Role-Based Access Control (RBAC)"], "a": 3, "e": "RBAC centralizes privilege management through roles."}, {"n": 9, "d": "Medium", "q": "In a manufacturing workload, engineers want to select a prior table state using Snowflake Time Travel syntax. What should they use?", "o": ["SINCE", "AT | BEFORE", "VERSION", "AFTER ONLY"], "a": 1, "e": "AT or BEFORE clauses are used for historical Time Travel queries."}, {"n": 10, "d": "Medium", "q": "An architect for a marketing system has one key requirement: let users submit queries without manually resuming the warehouse first. Which option best satisfies it?", "o": ["Auto-Suspend", "Resource Monitor", "Time Travel", "Auto-Resume"], "a": 3, "e": "Auto-Resume starts compute when work is submitted."}, {"n": 11, "d": "Hard", "q": "A insurance platform must centralize metadata and coordinate query processing. The team wants the most direct Snowflake mechanism rather than a workaround. Which choice is best?", "o": ["Storage Layer", "Virtual Warehouse", "Services Layer", "External Stage"], "a": 2, "e": "The Services Layer manages metadata, security coordination, parsing, and optimization."}, {"n": 12, "d": "Medium", "q": "In a insurance workload, engineers want to choose whether COPY stops, continues, or skips files when errors occur. What should they use?", "o": ["SKIP_HEADER", "FORCE", "AUTO_SUSPEND", "ON_ERROR"], "a": 3, "e": "ON_ERROR controls COPY INTO behavior when loading errors are encountered."}, {"n": 13, "d": "Easy", "q": "For the requirement \"execute SQL from a JavaScript stored procedure,\" which Snowflake term is the best fit?", "o": ["snowflake.query()", "sql.execute()", "snowflake.execute()", "snowflake.run()"], "a": 2, "e": "snowflake.execute() is used to execute SQL in JavaScript stored procedures."}, {"n": 14, "d": "Easy", "q": "For the requirement \"provide compute resources for query processing,\" which Snowflake term is the best fit?", "o": ["Storage Layer", "Database Schema", "Secure View", "Virtual Warehouse"], "a": 3, "e": "A virtual warehouse supplies compute for queries and data processing."}, {"n": 15, "d": "Easy", "q": "Which Snowflake concept is primarily used to reduce rows before an expensive join when predicates can be applied early?", "o": ["Use CROSS JOIN first", "Filter Before Joining", "Remove WHERE clauses", "Select every column first"], "a": 1, "e": "Early filtering can reduce join input and improve efficiency."}, {"n": 16, "d": "Hard", "q": "A supply chain platform must organize related database objects under a new schema. The team wants the most direct Snowflake mechanism rather than a workaround. Which choice is best?", "o": ["CREATE DATABASE", "CREATE TABLE", "CREATE SCHEMA", "ALTER SCHEMA"], "a": 2, "e": "CREATE SCHEMA creates a schema."}, {"n": 17, "d": "Hard", "q": "A banking team is troubleshooting a design. The required outcome is to share selected data while reducing visibility into the underlying view definition, but the current approach does not provide that behavior. Which option should replace the current approach?", "o": ["Materialized View", "External Table", "Secure View", "Temporary View"], "a": 2, "e": "Secure views help protect view definitions while exposing governed results."}, {"n": 18, "d": "Easy", "q": "Which option best matches this Snowflake responsibility: extract the month component from a date or timestamp?", "o": ["DATE_PART('month', date_col)", "LENGTH(date_col)", "COALESCE(date_col)", "COUNT(date_col)"], "a": 0, "e": "DATE_PART can extract a requested date/time part such as month."}, {"n": 19, "d": "Easy", "q": "Which Snowflake concept is primarily used to query or restore historical table data within the retention period?", "o": ["Result Cache", "Time Travel", "Account Replication", "Secure Data Sharing"], "a": 1, "e": "Time Travel provides historical access and recovery within configured retention."}, {"n": 20, "d": "Hard", "q": "A logistics platform must load files soon after they arrive in cloud storage without repeatedly running manual COPY commands. The team wants the most direct Snowflake mechanism rather than a workaround. Which choice is best?", "o": ["Scheduled COPY worksheet", "Secure Data Sharing", "Time Travel", "Snowpipe"], "a": 3, "e": "Snowpipe provides continuous/automated file ingestion."}, {"n": 21, "d": "Easy", "q": "Which option best matches this Snowflake responsibility: ignore one or more leading rows in delimited source files?", "o": ["SKIP_HEADER", "FIELD_DELIMITER", "TRIM_SPACE", "COMPRESSION"], "a": 0, "e": "SKIP_HEADER specifies how many initial rows to ignore."}, {"n": 22, "d": "Hard", "q": "A e-commerce team is troubleshooting a design. The required outcome is to apply delimiter, header, compression, and related parsing settings consistently, but the current approach does not provide that behavior. Which option should replace the current approach?", "o": ["WAREHOUSE", "QUERY_TAG", "FILE_FORMAT", "STORAGE_INTEGRATION"], "a": 2, "e": "FILE_FORMAT supplies parsing rules for staged files."}, {"n": 23, "d": "Easy", "q": "For the requirement \"validate staged data and return loading errors without inserting rows,\" which Snowflake term is the best fit?", "o": ["VALIDATION_MODE = 'RETURN_ERRORS'", "FORCE = TRUE", "ON_ERROR = 'CONTINUE'", "PURGE = TRUE"], "a": 0, "e": "VALIDATION_MODE can inspect load errors without loading the data."}, {"n": 24, "d": "Hard", "q": "During a design review for a insurance solution, the team must ensure it can run SQL workloads without storing table data inside the compute resource. Which Snowflake option is the strongest architectural fit?", "o": ["Virtual Warehouse", "Storage Layer", "Database Schema", "Secure View"], "a": 0, "e": "A virtual warehouse supplies compute for queries and data processing."}, {"n": 25, "d": "Easy", "q": "Which option best matches this Snowflake responsibility: identify expensive operators such as joins, scans, and aggregations in Query Profile?", "o": ["Role Graph", "Execution Graph", "Stage Listing", "Account Map"], "a": 1, "e": "The execution graph shows operators and their relationships in a query plan."}, {"n": 26, "d": "Medium", "q": "A media platform is being redesigned so it can measure record counts in an aggregation. Which choice is most appropriate?", "o": ["COUNT()", "SUM()", "LENGTH()", "TOTAL()"], "a": 0, "e": "COUNT is the standard aggregate for counting rows or values."}, {"n": 27, "d": "Medium", "q": "A logistics platform is being redesigned so it can capture execution errors and implement controlled handling logic. Which choice is most appropriate?", "o": ["WHEN / THEN", "TRY / CATCH", "ON ERROR DO", "IF / ELSE only"], "a": 1, "e": "JavaScript TRY/CATCH provides exception handling in stored procedures."}, {"n": 28, "d": "Medium", "q": "In a education workload, engineers want to let a partner query provider-controlled data without receiving a physical copy. What should they use?", "o": ["External Data Export", "Zero-Copy Cloning", "Account Replication", "Secure Data Sharing"], "a": 3, "e": "Secure Data Sharing exposes live data without copying or exporting it."}, {"n": 29, "d": "Easy", "q": "Which Snowflake concept is primarily used to return rows where the join condition matches on both sides?", "o": ["LEFT JOIN", "CROSS JOIN", "FULL OUTER JOIN", "INNER JOIN"], "a": 3, "e": "INNER JOIN returns matching rows from both inputs."}, {"n": 30, "d": "Medium", "q": "A travel team needs to retain all primary entities even when optional related data is missing. Which Snowflake option best meets this requirement?", "o": ["INNER JOIN", "LEFT JOIN", "RIGHT JOIN", "CROSS JOIN"], "a": 1, "e": "LEFT JOIN preserves all left-side rows."}, {"n": 31, "d": "Medium", "q": "The data team at a SaaS company must submit a SQL statement from procedure code. Which Snowflake feature or command should they select?", "o": ["snowflake.query()", "snowflake.execute()", "sql.execute()", "snowflake.run()"], "a": 1, "e": "snowflake.execute() is used to execute SQL in JavaScript stored procedures."}, {"n": 32, "d": "Medium", "q": "A media team needs to reuse an S3, Azure Blob, or GCS location for data loading. Which Snowflake option best meets this requirement?", "o": ["Internal Stage", "Virtual Warehouse", "External Stage", "Secure View"], "a": 2, "e": "An external stage references files in supported external cloud storage."}, {"n": 33, "d": "Medium", "q": "A financial services team needs to control unexpected compute spending across warehouses. Which Snowflake option best meets this requirement?", "o": ["Resource Monitor", "Network Policy", "Secure View", "Query Profile"], "a": 0, "e": "Resource monitors govern credit consumption and can trigger notifications or suspension actions."}, {"n": 34, "d": "Easy", "q": "For the requirement \"define how staged source files should be parsed,\" which Snowflake term is the best fit?", "o": ["WAREHOUSE", "FILE_FORMAT", "QUERY_TAG", "STORAGE_INTEGRATION"], "a": 1, "e": "FILE_FORMAT supplies parsing rules for staged files."}, {"n": 35, "d": "Hard", "q": "A retail platform must permit Snowpipe or COPY operations to discover and read source objects securely. The team wants the most direct Snowflake mechanism rather than a workaround. Which choice is best?", "o": ["IAM role with DELETE only", "IAM role with GET and LIST permissions", "EC2 instance profile only", "Lambda execution role only"], "a": 1, "e": "For S3 access, Snowflake needs permissions that allow listing and reading the required objects."}, {"n": 36, "d": "Medium", "q": "The data team at a telecommunications company must judge whether filters are pruning storage effectively. Which Snowflake feature or command should they select?", "o": ["Rows Inserted", "Partitions Scanned", "Credits Remaining", "Roles Evaluated"], "a": 1, "e": "Partitions Scanned indicates the micro-partitions read by a query."}, {"n": 37, "d": "Easy", "q": "For the requirement \"store semi-structured values such as nested JSON,\" which Snowflake term is the best fit?", "o": ["VARCHAR", "NUMBER", "VARIANT", "BOOLEAN"], "a": 2, "e": "VARIANT is designed to store and query semi-structured data."}, {"n": 38, "d": "Easy", "q": "Which option best matches this Snowflake responsibility: produce the Cartesian product of two input tables?", "o": ["INNER JOIN", "SELF JOIN", "CROSS JOIN", "LEFT JOIN"], "a": 2, "e": "CROSS JOIN returns all possible row combinations."}, {"n": 39, "d": "Hard", "q": "During a design review for a digital payments solution, the team must ensure it can persistent storage remains available independently of compute. Which Snowflake option is the strongest architectural fit?", "o": ["Compute Layer", "Storage Layer", "Services Layer", "Virtual Warehouse"], "a": 1, "e": "The Storage Layer persists table data and organizes it into compressed micro-partitions."}, {"n": 40, "d": "Medium", "q": "A banking platform is being redesigned so it can land evolving JSON structures before extracting selected attributes. Which choice is most appropriate?", "o": ["VARCHAR", "VARIANT", "NUMBER", "BOOLEAN"], "a": 1, "e": "VARIANT is designed to store and query semi-structured data."}, {"n": 41, "d": "Easy", "q": "Which option best matches this Snowflake responsibility: drop a table only when it exists without raising a missing-object error?", "o": ["DROP TABLE ONLY IF ROWS", "TRUNCATE TABLE IF EXISTS", "DROP TABLE IF EXISTS", "DELETE TABLE IF EXISTS"], "a": 2, "e": "IF EXISTS prevents an error when the target table does not exist."}, {"n": 42, "d": "Medium", "q": "A financial services team needs to invoke an existing Snowflake stored procedure. Which Snowflake option best meets this requirement?", "o": ["CALL procedure_name()", "EXEC procedure_name", "RUN procedure_name", "SELECT PROCEDURE"], "a": 0, "e": "CALL is used to execute a stored procedure."}, {"n": 43, "d": "Hard", "q": "A financial services platform must address the built-in table stage for a specific table. The team wants the most direct Snowflake mechanism rather than a workaround. Which choice is best?", "o": ["@~", "@%table_name", "@stage_name", "@database.schema"], "a": 1, "e": "The @%table_name syntax refers to a table stage."}, {"n": 44, "d": "Medium", "q": "A manufacturing team needs to delete only records that meet a row condition. Which Snowflake option best meets this requirement?", "o": ["DROP TABLE", "TRUNCATE TABLE", "REMOVE FROM", "DELETE FROM"], "a": 3, "e": "DELETE FROM removes qualifying rows."}, {"n": 45, "d": "Hard", "q": "A manufacturing engineer is asked to meet this constraint: land evolving JSON structures before extracting selected attributes. Which option addresses the constraint with the least unnecessary complexity?", "o": ["VARIANT", "VARCHAR", "NUMBER", "BOOLEAN"], "a": 0, "e": "VARIANT is designed to store and query semi-structured data."}, {"n": 46, "d": "Easy", "q": "A trainee needs to identify the Snowflake feature that can reuse an eligible prior query result without recomputing it. Which choice is correct?", "o": ["Local Disk Cache", "Clustering Key", "Multi-Cluster Warehouse", "Result Cache"], "a": 3, "e": "The result cache stores eligible query results independently of warehouse local cache."}, {"n": 47, "d": "Easy", "q": "A trainee needs to identify the Snowflake feature that can upload local files to a Snowflake internal stage. Which choice is correct?", "o": ["COPY INTO", "MERGE", "LIST", "PUT"], "a": 3, "e": "PUT uploads local files to internal stages."}, {"n": 48, "d": "Easy", "q": "For the requirement \"reference the internal table stage associated with a table,\" which Snowflake term is the best fit?", "o": ["@%table_name", "@~", "@stage_name", "@database.schema"], "a": 0, "e": "The @%table_name syntax refers to a table stage."}, {"n": 49, "d": "Medium", "q": "The data team at a digital payments company must share selected data while reducing visibility into the underlying view definition. Which Snowflake feature or command should they select?", "o": ["Materialized View", "Secure View", "External Table", "Temporary View"], "a": 1, "e": "Secure views help protect view definitions while exposing governed results."}, {"n": 50, "d": "Hard", "q": "A telecommunications team is troubleshooting a design. The required outcome is to intentionally process a previously loaded file again, but the current approach does not provide that behavior. Which option should replace the current approach?", "o": ["PURGE = TRUE", "MATCH_BY_COLUMN_NAME", "VALIDATION_MODE", "FORCE = TRUE"], "a": 3, "e": "FORCE=TRUE overrides normal duplicate-file load-history protection."}, {"n": 51, "d": "Easy", "q": "A trainee needs to identify the Snowflake feature that can inspect metadata about previously executed queries. Which choice is correct?", "o": ["LOAD_HISTORY only", "WAREHOUSE_USAGE_HISTORY", "STAGE_HISTORY", "QUERY_HISTORY"], "a": 3, "e": "QUERY_HISTORY exposes query execution history metadata."}, {"n": 52, "d": "Easy", "q": "Which Snowflake capability directly supports the need to synchronize a target table with a source using matched and unmatched conditions?", "o": ["UNION", "COPY INTO", "MERGE", "ALTER TABLE"], "a": 2, "e": "MERGE supports matched/unmatched DML logic against a target table."}, {"n": 53, "d": "Easy", "q": "For the requirement \"query individual attributes inside semi-structured JSON values,\" which Snowflake term is the best fit?", "o": ["Result Cache lookup", "Nested field access from VARIANT", "Warehouse metadata scan", "Role inheritance"], "a": 1, "e": "Snowflake supports SQL access to nested elements stored in VARIANT values."}, {"n": 54, "d": "Medium", "q": "A manufacturing platform is being redesigned so it can perform conditional insert/update logic for incremental data. Which choice is most appropriate?", "o": ["UNION", "COPY INTO", "MERGE", "ALTER TABLE"], "a": 2, "e": "MERGE supports matched/unmatched DML logic against a target table."}, {"n": 55, "d": "Medium", "q": "A travel team needs to derive a month value for grouping time-based reporting. Which Snowflake option best meets this requirement?", "o": ["LENGTH(date_col)", "COALESCE(date_col)", "COUNT(date_col)", "DATE_PART('month', date_col)"], "a": 3, "e": "DATE_PART can extract a requested date/time part such as month."}, {"n": 56, "d": "Easy", "q": "A trainee needs to identify the Snowflake feature that can organize table data into small columnar storage units with metadata. Which choice is correct?", "o": ["Micro-partitions", "Virtual Warehouses", "Result Sets", "Secure Views"], "a": 0, "e": "Snowflake automatically stores table data in micro-partitions with metadata used for pruning."}, {"n": 57, "d": "Easy", "q": "For the requirement \"display files currently present in a stage,\" which Snowflake term is the best fit?", "o": ["SHOW FILES", "DESCRIBE STAGE", "LIST @stage_name", "SELECT FILES"], "a": 2, "e": "LIST shows files available in a Snowflake stage."}, {"n": 58, "d": "Medium", "q": "A digital payments team needs to run SQL workloads without storing table data inside the compute resource. Which Snowflake option best meets this requirement?", "o": ["Storage Layer", "Database Schema", "Virtual Warehouse", "Secure View"], "a": 2, "e": "A virtual warehouse supplies compute for queries and data processing."}, {"n": 59, "d": "Medium", "q": "A SaaS platform is being redesigned so it can grant only intentional
